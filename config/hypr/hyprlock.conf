# background
background {
    monitor =
    path = $HOME/.local/state/blackarch/current/background
    color = rgba(20, 20, 20, 1)
    blur_passes = 1
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# general
general {
    ignore_empty_input = false
    hide_cursor = false
}

# animations
animations {
    enabled = true
}

# input field
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(236, 240, 15, 1)
    inner_color = rgba(240, 204, 14, 1)
    font_color = rgba(240, 240, 240, 1)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span foreground="##000000">Input Password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

# Profile Picture
image {
    monitor =
    path = $HOME/.config/blackarch/themes/blackarch/backgrounds/Hacker.png
    size = 200
    border_size = 2
    border_color = rgba(255, 255, 255, 1)
    position = 0, 0
    halign = center
    valign = center
}

# Auth module
# Auth disabled on lock; use manual command: sudo TERM=dumb PYTHONPATH=/usr/lib/howdy /usr/bin/howdy test
auth {
    pam {
        module = hyprlock
    }
}

