# include ~/.config/blackarch/current/theme/kitty.conf
include colors-kitty.conf
# include ~/.cache/wal/colors-kitty.conf

# Font
font_family Terminus
bold_italic_font auto
font_size 18.0
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted

# kitty_mod        ctrl
map ctrl+right next_tab
map ctrl+left previous_tab

# Optional: Move the current tab left or right with Ctrl + Shift + Arrow
map ctrl+shift+left move_tab_backward
map ctrl+shift+right move_tab_forward

# shortcuts for program
confirm_os_window_close 0
background_opacity 0.7

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+shift+y launch --type=window yazi
map ctrl+shift+k launch --type=tab kitty @ set-colors --all $HOME/.config/kitty/colors-kitty.conf
map ctrl+0 launch --type=tab kill -9 mpv cliamp
map ctrl+1 launch --type=tab bluetoothctl connect 50:39:E9:89:2B:C9
map ctrl+2 launch --type=tab bluetoothctl disconnect 50:39:E9:89:2B:C9
map ctrl+3 launch --type=tab cliamp
map ctrl+w launch --type=tab wiremix

#
# Window
window_padding_width 0
window_padding_height 0
# hide_window_decorations yes
# show_window_resize_notification no
confirm_os_window_close 0

# Allow remote access
single_instance no
allow_remote_control yes
listen_on unix:/tmp/kitty
# Aesthetics
cursor_shape block
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
# tab_bar_style               hidden
# tab_powerline_style         slanted
# tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
