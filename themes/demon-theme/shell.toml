# Blackarch Quattro shell surfaces for Demon.
# Legacy Waybar, Walker, Mako, SwayOSD, and Hyprlock files remain authoritative
# on Blackarch 3.8.x. These tokens reproduce their supported visual roles in the
# Quattro shell without changing the legacy files.

[bar]
background = "#19120d"
background-alpha = 1.0
text = "#b46212"
active = "#FF4500"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#3A403B"
active-border-foreground = "#FFAA00"

[controls]
normal-color = "#E0D4C2"
normal-fill-alpha = 0.03
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color = "#7A7D80"
hover-cursor-fill-alpha = 0.12
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.62

focus-color = "#FF4500"
focus-fill-alpha = 0.14
focus-border-width = 2
focus-border-alpha = 0.90

selected-color = "#FFAA00"
selected-fill-alpha = 0.22
selected-border-width = 1
selected-border-alpha = 0.82

pressed-color = "#BB1C1C"
pressed-fill-alpha = 0.30
selection-color = "#FF4500"
selection-fill-alpha = 0.42

[spacing]
scale = 1.0
scale-with-font = true
xs = 2
md = 4
control-padding-y = 4
panel-padding = 8

[font]
base-size = 12
heading = 16
icon-large = 18

[popups]
background = "#0F0F0F"
background-alpha = 1.0
text = "#FFAA00"
border = "#3A403B"
border-alpha = 1.0
border-width = 1

[tooltip]
background = "#0F0F0F"
background-alpha = 0.98
text = "#E0D4C2"
border = "#3A403B"
border-alpha = 1.0
border-width = 1

[notifications]
background = "#0F0F0F"
background-alpha = 1.0
text = "#FFAA00"
border = "#3A403B"
border-alpha = 1.0
border-width = 2
countdown = "#FF4500"

[launcher]
background = "#0F0F0F"
background-alpha = 0.98
text = "#7A7D80"
border = "#3A403B"
border-alpha = 1.0
border-width = 2
scrim = "#0F0F0F"
scrim-alpha = 0.0
selected-background = "#3A403B"
selected-background-alpha = 0.45
selected-text = "#FFAA00"
selected-border = "#5C624B"
selected-border-alpha = 0.90
selected-border-width = 1

[menu]
background = "#0F0F0F"
background-alpha = 0.98
text = "#7A7D80"
border = "#3A403B"
border-alpha = 1.0
border-width = 2
scrim = "#0F0F0F"
scrim-alpha = 0.0
selected-background = "#3A403B"
selected-background-alpha = 0.45
selected-text = "#FFAA00"
selected-border = "#5C624B"
selected-border-alpha = 0.90
selected-border-width = 1

[polkit]
background = "#0F0F0F"
background-alpha = 0.98
text = "#E0D4C2"
text-error = "#BB1C1C"
border = "#3A403B"
border-error = "#FF4500"
border-alpha = 1.0
border-width = 2
scrim = "#0F0F0F"
scrim-alpha = 0.55
accent = "#FFAA00"

[lock]
background = "#0F0F0F"
background-alpha = 1.0
text = "#FFAA00"
placeholder = "#FFAA00B3"
text-error = "#BB1C1C"
border = "#3A403B"
border-active = "#FFAA00"
border-error = "#BB1C1C"
border-alpha = 1.0
border-width = 2
selection = "#FF4500"
selection-alpha = 0.45

[image-picker]
scrim = "#0F0F0F"
scrim-alpha = 0.55
text = "#E0D4C2"
selected-border = "#FFAA00"
selected-border-alpha = 1.0
unselected-border = "#E0D4C2"
unselected-border-alpha = 0.28
